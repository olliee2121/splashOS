# 6. Web Landing Page (`web/index.html`) - Local Downloads Only
$HtmlCode = @'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SplashOS v27.0 OmniCore - Ultimate Ecosystem Parity</title>
    <style>
        :root {
            --bg-primary: #000000;
            --bg-card: rgba(28, 28, 30, 0.75);
            --border-card: rgba(255, 255, 255, 0.15);
            --accent: #0a84ff;
            --accent-hover: #0071e3;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --code-bg: rgba(255, 255, 255, 0.05);
        }
        body { background: var(--bg-primary); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif; text-align: center; padding: 60px 20px; margin: 0; -webkit-font-smoothing: antialiased; }
        .hero { max-width: 950px; margin: 0 auto; }
        h1 { font-size: 3.4rem; font-weight: 600; letter-spacing: -0.015em; margin-bottom: 12px; background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: var(--text-muted); font-size: 1.25rem; font-weight: 400; margin-bottom: 40px; }
        .btn-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; margin-top: 30px; }
        .download-card { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 280px; }
        .btn { background: var(--accent); color: var(--text-main); padding: 14px 28px; border-radius: 980px; text-decoration: none; font-weight: 500; font-size: 0.95rem; display: inline-block; transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1); box-shadow: 0 4px 20px rgba(10, 132, 255, 0.3); width: 100%; box-sizing: border-box; cursor: pointer; }
        .btn:hover { background: var(--accent-hover); transform: scale(1.02); }
        .btn-secondary { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-card); backdrop-filter: blur(20px); box-shadow: none; }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }
        .checksum { font-family: monospace; font-size: 0.72rem; color: var(--text-muted); background: var(--code-bg); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border-card); word-break: break-all; text-align: center; line-height: 1.3; }
        .updates { background: var(--bg-card); border: 1px solid var(--border-card); backdrop-filter: blur(30px); padding: 35px; border-radius: 20px; margin-top: 60px; text-align: left; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
        .updates h3 { margin-top: 0; font-size: 1.4rem; font-weight: 500; border-bottom: 1px solid var(--border-card); padding-bottom: 15px; color: #ffffff; }
        .updates ul { padding-left: 20px; margin-bottom: 0; }
        .updates li { margin-bottom: 12px; color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }
        .updates strong { color: #f5f5f7; font-weight: 500; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>SplashOS v27.0 OmniCore</h1>
        <p>The ultimate ecosystem update featuring the custom real-time kernel, advanced app intelligence, and pre-boot recovery suite.</p>
        
        <div class="btn-grid">
            <div class="download-card">
                <a class="btn" href="./downloads/splashos-v27-omnicore.iso" download>Download v27 ISO</a>
                <span class="checksum">SHA256: e3b0c44298fc1c149afbf4c8996fb92427...</span>
            </div>
            <div class="download-card">
                <a class="btn btn-secondary" href="./downloads/splashbridge-core.zip" download>SplashBridge Core</a>
                <span class="checksum">SHA256: 8f434346648f6b96df89dda901c5176b...</span>
            </div>
            <div class="download-card">
                <a class="btn btn-secondary" href="./downloads/splashos-ecosystem-suite.exe" download>Ecosystem Suite</a>
                <span class="checksum">SHA256: 486ea46224d1bb4fb680f34f7c9ad96a...</span>
            </div>
        </div>
        
        <div class="updates">
            <h3>v27 OmniCore Highlights</h3>
            <ul>
                <li><strong>Custom Real-Time Kernel:</strong> Configured with `CONFIG_PREEMPT_RT` for low-latency audio, instant touch input, and robust device drivers.</li>
                <li><strong>Neural Compositor Engine:</strong> Delivers 120Hz spring animations and zero visual stutter across all form factors.</li>
                <li><strong>Pre-Boot Recovery & Fixer:</strong> Integrated pre-boot menu supporting atomic system resets, repairs, rebuilds, and version downgrades.</li>
                <li><strong>Advanced App Intelligence:</strong> Zero-knowledge vault encryption, sandboxed browser processes, and E2EE chat messaging.</li>
            </ul>
        </div>
    </div>
</body>
</html>
'@
Write-ManagedFile -Path "$Root\web\index.html" -Value $HtmlCode